name: Android build

on:
  push:
    paths: ["android/**", "data/**", "fonts/**", ".github/workflows/android.yml"]
  pull_request:
    paths: ["android/**", "data/**", "fonts/**", ".github/workflows/android.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Build the debug APK
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug
      - name: Check the APK
        run: |
          apk=android/app/build/outputs/apk/debug/app-debug.apk
          for f in layout.json words.json nasin-nanpa-subset.otf; do unzip -l "$apk" | grep -q "assets/$f" || { echo "missing $f"; exit 1; }; done
          ls -la "$apk"
      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: nasin-luka-pona-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
