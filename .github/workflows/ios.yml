name: iOS build

on:
  push:
    paths: ["ios/**", "data/**", "fonts/**", ".github/workflows/ios.yml"]
  pull_request:
    paths: ["ios/**", "data/**", "fonts/**", ".github/workflows/ios.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the app and keyboard for the simulator (unsigned)
        run: |
          xcodebuild -version
          xcodebuild -project ios/NasinLukaPona.xcodeproj -target NasinLukaPona -configuration Debug \
            -sdk iphonesimulator CODE_SIGNING_ALLOWED=NO build
      - name: Check the keyboard bundle
        run: |
          appex=ios/build/Debug-iphonesimulator/NasinLukaPona.app/PlugIns/NasinLukaPonaKeyboard.appex
          ls -la "$appex"
          test -f "$appex/layout.json" && test -f "$appex/words.json" && test -f "$appex/nasin-nanpa-subset.otf"
          plutil -p "$appex/Info.plist"
