:root {
  --bg: #eef0f2; --surface: #ffffff; --key: #ffffff; --key-side: #c9ced4; --fg: #1d2226; --muted: #66707a; --line: #d3d8dd;
  --accent: #1f6f5c; --accent-soft: #e2f0eb; --hot: #1f6f5c; --hot-fg: #ffffff;
  --sans: "Helvetica Neue", Helvetica, "Hiragino Sans", "Hiragino Kaku Gothic ProN", Arial, sans-serif;
  --sp: "nasin nanpa", var(--sans);
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #121517; --surface: #1a1f22; --key: #3a4045; --key-side: #262b2f; --fg: #e9edf0; --muted: #98a3ac; --line: #2c3338;
  --accent: #5fc4a6; --accent-soft: #1d3530; --hot: #5fc4a6; --hot-fg: #0f1a17; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #121517; --surface: #1a1f22; --key: #3a4045; --key-side: #262b2f; --fg: #e9edf0; --muted: #98a3ac; --line: #2c3338;
  --accent: #5fc4a6; --accent-soft: #1d3530; --hot: #5fc4a6; --hot-fg: #0f1a17; color-scheme: dark }
html, body { background: var(--bg); color: var(--fg); font-family: var(--sans); }
body { font-size: 15px; line-height: 1.5; }
.wrap { max-width: 480px; margin: 0 auto; padding-block: 14px 40px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: grid; gap: 12px; }
h1 { font-size: 1.15rem; margin: 0; }
/* the intro starts folded so the keyboard fits on a phone screen without scrolling */
.top { display: flex; align-items: baseline; gap: 14px; }
.top h1 { margin-right: auto; }
.link { font: inherit; font-size: 0.8rem; color: var(--accent); background: none; border: 0; padding: 2px 0; cursor: pointer; white-space: nowrap; }
#info::after { content: " ▸"; }
#info[aria-expanded="true"]::after { content: " ▾"; }
.lede { display: grid; gap: 4px; color: var(--muted); font-size: 0.82rem; }
.lede[hidden] { display: none; }
.lede p { margin: 0; }
.seg .sp { font-family: var(--sp); font-size: 1rem; line-height: 1; }
.out { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; display: grid; gap: 6px; }
.sp-line { font-family: var(--sp); font-size: 1.7rem; line-height: 1.3; min-height: 2.2rem; overflow-wrap: anywhere; }
textarea { font: inherit; font-size: 1rem; width: 100%; box-sizing: border-box; min-height: 3.2rem; resize: vertical; border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; background: var(--bg); color: var(--fg); }
.row-btn { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
button { font: inherit; cursor: pointer; }
.btn { font-size: 0.85rem; padding: 5px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); color: var(--fg); }
.btn.primary { background: var(--accent); color: var(--hot-fg); border-color: var(--accent); }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--surface); }
.seg button { font-size: 0.8rem; padding: 5px 7px; border: 0; background: transparent; color: var(--fg); }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--hot-fg); }
button:focus-visible, textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.status { font-size: 0.78rem; color: var(--muted); min-height: 1.2em; }
.status:empty { display: none; }

.kb { background: var(--key-side); border-radius: 12px; padding: 5px; display: grid; grid-template-columns: 0.7fr repeat(3, minmax(0,1fr)) 0.7fr; gap: 5px;
  user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; touch-action: none; }
.key { position: relative; background: var(--key); border: 0; border-radius: 8px; color: var(--fg); aspect-ratio: 0.82 / 1; min-width: 0;
  box-shadow: 0 1px 0 rgba(0,0,0,.18); padding: 0; touch-action: none; overflow: visible; }
.key.empty { opacity: .35; }
.key .c { position: absolute; left: 50%; top: 50%; transform: translate(-50%,-50%); font-size: 1.05rem; font-weight: 700; white-space: nowrap; }
.key .d { position: absolute; font-size: 0.56rem; color: var(--muted); white-space: nowrap; line-height: 1; }
.key .d.pl { left: 4px; top: 50%; transform: translateY(-50%); }
.key .d.pu { top: 4px; left: 50%; transform: translateX(-50%); }
.key .d.pr { right: 4px; top: 50%; transform: translateY(-50%); }
.key .d.pd { bottom: 4px; left: 50%; transform: translateX(-50%); }
.key .g { position: absolute; left: 4px; bottom: 3px; font-size: 0.5rem; color: var(--accent); display: none; }
.sp-mode .key .c { font-family: var(--sp); font-weight: 400; font-size: 1.6rem; }
.sp-mode .key .d { font-family: var(--sp); font-size: 0.85rem; }

.key.side { background: var(--key-side); filter: brightness(1.08); font-size: 0.85rem; font-weight: 600; aspect-ratio: auto; }
.key.side.on { background: var(--accent); color: var(--hot-fg); filter: none; }
.key.side.on small { color: var(--hot-fg); }
.key.side .lk { display: block; font-family: var(--sp); font-weight: 400; font-size: 1.7rem; line-height: 1.1; }
.key.side .lw { display: block; font-size: 0.85rem; }
.key.side.punc .c { font-size: 1.2rem; }
.key .globe { width: 1.35rem; height: 1.35rem; display: block; margin: 0 auto; }
.key.side.punc .d { font-size: 0.85rem; font-family: var(--sans); }
.key.side small { display: block; font-size: 0.6rem; color: var(--muted); font-weight: 400; }
.key.pressed { background: var(--accent-soft); }
.pop { position: absolute; left: 50%; bottom: calc(100% + 6px); transform: translateX(-50%); background: var(--hot); color: var(--hot-fg);
  border-radius: 8px; padding: 6px 10px; font-weight: 700; font-size: 1rem; white-space: nowrap; pointer-events: none; z-index: 5; display: grid; justify-items: center; gap: 2px; }
.pop .pg { font-family: var(--sp); font-weight: 400; font-size: 1.8rem; line-height: 1; }
/* flick guide: while a word or letter key is held, its five slots form a cross around it */
.key.pressed { z-index: 4; }
.guide { position: absolute; left: -100%; top: -100%; width: 300%; height: 300%; display: grid;

function toSp(s){

function dirOf(dx, dy){
  if (Math.hypot(dx, dy) < 18) return 0;
  return Math.abs(dx) > Math.abs(dy) ? (dx < 0 ? 1 : 3) : (dy < 0 ? 2 : 4);

// a short tick, like a key click; "ambient" lets the phone's silent switch mute it

  if (!sound) return;

    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    const t = actx.currentTime, o = actx.createOscillator(), v = actx.createGain();
    o.type = "triangle"; o.frequency.value = 1500;
    v.gain.setValueAtTime(0.08, t); v.gain.exponentialRampToValueAtTime(0.0001, t + 0.03);
    o.connect(v).connect(actx.destination); o.start(t); o.stop(t + 0.04);
  } catch (e) {}
}

function attachFlick(el, slots, onPick, popLabel, opts = {}){

      }
      pop.querySelectorAll(".gc").forEach(c => c.classList.toggle("cur", +c.dataset.i === i));

    if (e.pointerId !== id) return;
    stopRepeat();
    el.classList.remove("pressed"); if (pop){ pop.remove(); pop = null; }
    if (commit && !repeating && slots[cur]) onPick(slots[cur], cur);
    id = null;
  };
  el.addEventListener("pointerup", end(true));
  el.addEventListener("pointercancel", end(false));
}

const wordPop = w => `<span class="pg">${g(w)}</span><span>${w}</span>`;
const textPop = s => `<span>${s}</span>`;

function sideKey(label, sub, slots, onPick, pop, active, aria, opts){
  const b = document.createElement("button");
  b.className = "key side" + (active ? " on" : ""); b.type = "button";
  b.innerHTML = `${label}${sub ? `<small>${sub}</small>` : ""}`;
  b.setAttribute("aria-label", aria || (label + (sub ? " " + sub : "")));
  attachFlick(b, slots, onPick, pop || (() => textPop(label)), opts);
  return b;
}
const go = (m, locked = false) => { mode = m; layerLock = locked; build(); };
// a side key that shows what it types: the tap in the middle, the flicks around it
function symbolKey(faces, slots, onPick, pop, aria){
  const b = document.createElement("button");
  b.className = "key side punc"; b.type = "button";
  b.setAttribute("aria-label", aria);
  b.innerHTML = `<span class="c">${faces[0]}</span>` + ["pl","pu","pr","pd"].map((d, j) => `<span class="d ${d}">${faces[j+1]}</span>`).join("");
  attachFlick(b, slots, onPick, pop);
  return b;
}
const puncKey = () => symbolKey(PUNCT, PUNCT, insertPunct, textPop,
  "Punctuation: tap for period, flick left for comma, up for question mark, down for exclamation mark");
const SPACE = [" ", ":", ":", ":", ":"];
// every flick types ":", but only the left one is drawn to keep the key quiet
const spaceKey = () => symbolKey(["␣", ":", "", "", ""], SPACE, v => v === " " ? insertChar(" ") : insertPunct(":"),
  v => textPop(v === " " ? "␣" : ":"), "Space: tap for a space, flick in any direction for a colon");
const LAYER_ICON = ["toki", "soweli", "poki"];
// a layer key shows that layer's icon word; while its layer is open it turns into the way back to layer 1.
// Tap: the layer is open for one word (light key). Flick: it stays open (solid key) until the key is tapped.
function layerKey(n){
  const open = mode === n, locked = open && layerLock, w = LAYER_ICON[open ? 0 : n];
  const face = labelSp ? `<span class="lk">${g(w)}</span>` : `<span class="lw">${w}</span>`;
  const b = sideKey(face, "", ["tap", "keep", "keep", "keep", "keep"],
    v => v === "tap" ? go(open ? 0 : n) : (locked || go(n, true)),
    v => v === "tap" ? wordPop(w) : textPop(locked ? "—" : t("keep")), open,
    open ? "Back to layer 1" : `Layer ${n + 1} for one word; flick to keep it open`);
  if (open && !locked) b.classList.add("soft");
  return b;
}
const one = v => [v,"","","",""];
// a line-drawn globe in the text color, instead of the colored 🌐 emoji
const GLOBE = `<svg class="globe" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.6">
  <circle cx="12" cy="12" r="9"/><ellipse cx="12" cy="12" rx="4" ry="9"/><path d="M3 12h18M5 7.5h14M5 16.5h14"/></svg>`;

function build(){
  kb.innerHTML = "";
  kb.classList.toggle("sp-mode", labelSp && mode < 3);
  $("layername").innerHTML = `<b>${t("names")[mode]}</b>` + (mode === 1 || mode === 2 ? t(layerLock ? "staysOpen" : "oneWord") : "");
  const keys = mode < 3 ? LAYOUT[mode] : ABC;
  const left = [
    mode === 3 ? sideKey(labelSp ? `<span class="lk">${g("toki")}</span>` : `<span class="lw">toki</span>`, "", one(1), () => go(0), () => wordPop("toki"), true, "Back to layer 1") : sideKey("ABC", "", one(1), () => go(3), null, false, "Letters"),
    layerKey(1),
    layerKey(2),
    sideKey(GLOBE, "", one(1), () => { $("status").textContent = t("globe"); },
      null, false, "Next keyboard"),
  ];
  const right = [
    sideKey("⌫", "", ["c","w","w","w","w"], (v) => v === "c" ? delChar() : delWord(),
      (v) => textPop(t(v === "c" ? "letter" : "word")), false, "Delete: tap for a letter, flick for a word, hold to keep deleting",
      { repeat: delChar }),
    spaceKey(),
    puncKey(),
    sideKey("⏎", "", one(1), () => put(txt.value.replace(/ +$/,"") + "\n")),
  ];
  keys.forEach((k, i) => {
    if (i % 3 === 0) kb.appendChild(left[i / 3]);
    const b = document.createElement("button");
    b.className = "key"; b.type = "button";
    const slots = k.w.slice(); while (slots.length < 5) slots.push("");
    const word = mode < 3;
    const lab = w => (word && labelSp) ? g(w) : w;
    if (!slots.some(Boolean)) b.classList.add("empty");
    b.setAttribute("aria-label", (k.g || "empty") + ": " + slots.filter(Boolean).join(", "));
    b.innerHTML = `<span class="c">${slots[0] ? lab(slots[0]) : ""}</span>` +
      ["pl","pu","pr","pd"].map((d, j) => slots[j+1] ? `<span class="d ${d}">${lab(slots[j+1])}</span>` : "").join("");
    if (word) attachFlick(b, slots, v => { insertWord(v); if (mode !== 0 && !layerLock) go(0); }, wordPop, { guide: true });
    else attachFlick(b, slots, v => v === SHIFT ? toggleCase() : insertLetter(v), v => textPop(v === SHIFT ? "Aa" : v), { guide: true });
    kb.appendChild(b);
    if (i % 3 === 2) kb.appendChild(right[(i - 2) / 3]);
  });
  renderLegend();
}

function renderLegend(){
  if (mode === 3){ $("legend").innerHTML = `<h2>${t("names")[3]}</h2><div class="lg-row"><span class="gn">${t("abcHow")}</span><span class="ws">${t("abc")}</span></div>`; holdLegendHeight(); return; }
  const keys = LAYOUT[mode].filter(k => k.g);
  const dirs = [t("tap"), "←", "↑", "→", "↓"];
  let h = `<h2>${t("names")[mode]}</h2>`;
  for (const k of keys){
    h += `<div class="lg-row"><span class="gn">${t("groups")[k.g] || k.g}</span><span class="ws">${k.w.map((w,i)=> w ? `<span class="dn">${dirs[i]}</span>${i===0?`<b>${w}</b>`:w}` : "").filter(Boolean).join("　")}</span></div>`;
  }
  $("legend").innerHTML = h;
  holdLegendHeight();
}
// the legend never gets shorter, so the page does not shrink and scroll the keyboard when you switch layers
let legendMin = 0;
function holdLegendHeight(){
  const el = $("legend");
  legendMin = Math.max(legendMin, el.offsetHeight);
  el.style.minHeight = legendMin + "px";
}
addEventListener("resize", () => { legendMin = 0; $("legend").style.minHeight = ""; holdLegendHeight(); });

function press(on, off){ on.setAttribute("aria-pressed","true"); off.setAttribute("aria-pressed","false"); }
$("lab-sp").onclick = () => { labelSp = true; press($("lab-sp"), $("lab-lat")); build(); };
$("lab-lat").onclick = () => { labelSp = false; press($("lab-lat"), $("lab-sp")); build(); };
$("clear").onclick = () => { put(""); };
$("snd").onclick = () => { sound = !sound; $("snd").setAttribute("aria-pressed", sound); };
$("copy").onclick = () => {
  const fail = () => { txt.select(); $("status").textContent = t("selected"); };
  try { navigator.clipboard.writeText(txt.value).then(() => { $("status").textContent = t("copied"); }, fail); } catch (e) { fail(); }
};
$("info").onclick = () => { const open = $("lede").hidden; $("lede").hidden = !open; $("info").setAttribute("aria-expanded", open); };
$("lang").onclick = () => {
  lang = lang === "tp" ? "en" : "tp";
  try { localStorage.setItem("lang", lang); } catch (e) {}
  legendMin = 0; $("legend").style.minHeight = "";
  applyLang(); build();
};
$("lab-sp").innerHTML = `<span class="sp">${g("sitelen")}${g("pona")}</span>`;
txt.addEventListener("input", refresh);
applyLang(); build(); refresh();
</script>

</html>
